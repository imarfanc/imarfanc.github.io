name: Site checks
on: [push, pull_request]
jobs:
  check:
    name: Build and check the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true
      - name: Build and check
        run: make check
